name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so the devintel git-metrics workflow (run by the
      # agentic self-test) sees real commit throughput, not just HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Header validator: missing/legacy keys fail the build before
      # anything broken can reach a device.
      - name: Header validation (verify_flipper_files.py)
        run: python scripts/verify_flipper_files.py

      # Prove the checkers themselves are trustworthy, then run them.
      - name: Data-test self-check (--selftest)
        run: python scripts/test_flipper_payloads.py --selftest

      # Data-level tests: RAW_Data timings, NFC checksums, IR widths,
      # EM4100 parity, BadUSB structure.
      - name: Data tests (test_flipper_payloads.py)
        run: python scripts/test_flipper_payloads.py

      # Agentic workflow self-test: runs the full pipeline
      # (validate -> curate -> sync-plan -> report) against a throwaway
      # FileStore, plus resume-after-failure, keyword/vector search, and
      # the devintel git-metrics workflow. No external services needed.
      - name: Agentic workflow self-test (test_agentic_workflow.py)
        run: python scripts/test_agentic_workflow.py

      # Cloudflare Worker (bugreaperx/) ships a TypeScript source tree
      # whose payload-generation API is gated by the same header checks
      # as flipper-sync. Make sure the worker compiles, so a broken
      # generate*() never silently ships.
      - name: Worker type-check (bugreaperx tsc --noEmit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bugreaperx/package-lock.json
      - name: Install worker dependencies
        working-directory: bugreaperx
        run: npm ci
      - name: tsc --noEmit
        working-directory: bugreaperx
        run: npx tsc --noEmit
